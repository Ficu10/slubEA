<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rozmieszczenie stołów — Emilka & Adaś</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Inline extra seating styles */
    .seating-controls{display:flex;gap:10px;align-items:center;margin-bottom:12px}
    .hall{background:linear-gradient(180deg,#fff,#f8fff8);border:1px solid rgba(47,111,78,0.07);height:520px;border-radius:10px;position:relative;padding:12px}
    .table{position:absolute;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#f3fff3);border:3px solid var(--green);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;cursor:pointer}
    .table .names{font-size:12px;color:#123;line-height:1.1}
    .table .num{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:2px 8px;border-radius:10px;font-size:12px}
    .table.highlight{box-shadow:0 0 0 6px rgba(47,111,78,0.12)}
    .table.rect{width:160px;height:90px;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .table.rect .num{top:-14px;padding:4px 10px;border-radius:14px}
    .hall-label{position:absolute;left:50%;transform:translateX(-50%);top:6px;color:var(--muted);font-weight:600}
    .seating-info{margin-top:10px;color:var(--muted)}
    .btn-outline{display:inline-block;padding:8px 12px;border-radius:8px;border:1px solid rgba(47,111,78,0.18);color:var(--green);text-decoration:none}
  </style>
</head>
<body>
  <header>
    <h1>Rozmieszczenie stołów — Emilka & Adaś</h1>
    <p class="date">10.10.2026</p>
    <nav class="top-nav">
      <a href="/" class="btn-outline">Strona główna</a>
      <a href="/login.html" class="btn-primary">Zaloguj</a>
    </nav>
  </header>
  <main>
    <section class="info">
      <h2>Rozmieszczenie stołów</h2>
      <div class="seating-controls">
        <input id="searchInput" placeholder="Wyszukaj osobę..." style="padding:8px;border-radius:8px;border:1px solid #ddd;flex:1">
        <button id="clearBtn" class="btn-outline">Wyczyść wyszukiwanie</button>
        <a href="/" class="btn-outline">Powrót</a>
      </div>
      <div class="hall" id="hall">
        <div class="hall-label">Sala weselna</div>
      </div>
      <div class="seating-info" id="seatingInfo">Kliknij stolik, aby przypisać listę gości (oddziel przecinkami). Dane zapisywane lokalnie w przeglądarce.</div>
    </section>
  </main>

  <script src="/seating.js"></script>
</body>
</html>
