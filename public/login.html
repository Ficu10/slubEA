<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Logowanie — Wesele</title>
  <link rel="stylesheet" href="/styles.css">
  <style>body{padding:30px} .login-box{max-width:420px;margin:30px auto;background:var(--panel);padding:18px;border-radius:10px;border:1px solid rgba(0,0,0,0.04)}</style>
</head>
<body>
  <header>
    <h1>Logowanie</h1>
    <nav class="top-nav">
      <a href="/" class="btn-outline">Strona główna</a>
      <a href="/seating.html" class="btn-outline">Rozmieszczenie stołów</a>
    </nav>
  </header>
  <main>
    <div class="login-box">
      <div style="display:flex;flex-direction:column;gap:8px">
        <input id="user" placeholder="Login" style="padding:8px;border-radius:6px;border:1px solid #ddd" autocomplete="username">
        <div style="display:flex;gap:8px;align-items:center">
          <input id="pass" placeholder="Hasło" type="password" style="flex:1;padding:8px;border-radius:6px;border:1px solid #ddd" autocomplete="current-password">
          <button id="togglePass" type="button" title="Pokaż/ukryj hasło" style="padding:6px 8px;margin-left:6px;border-radius:6px;border:1px solid rgba(0,0,0,0.08);background:#fff">Pokaż</button>
        </div>
        <div style="display:flex;gap:8px"><button id="loginBtn">Zaloguj</button><a href="/" class="btn-outline">Anuluj</a></div>
        <div id="msg" style="color:#c33"></div>
      </div>
    </div>
  </main>
  <script>
    // Toggle password visibility
    document.getElementById('togglePass').addEventListener('click', ()=>{
      const p = document.getElementById('pass');
      const btn = document.getElementById('togglePass');
      if (p.type === 'password'){ p.type = 'text'; btn.textContent = 'Ukryj'; }
      else { p.type = 'password'; btn.textContent = 'Pokaż'; }
    });

    // Debug element
    const debugInfo = document.createElement('div');
    debugInfo.id = 'debugInfo'; debugInfo.style.marginTop = '8px'; debugInfo.style.color = '#a33'; debugInfo.style.whiteSpace = 'pre-wrap';
    document.querySelector('.login-box > div').appendChild(debugInfo);

    // Local login (no server) - simple credential check with debug
    function updateDebug(note){
      try{
        const token = localStorage.getItem('adminToken');
        const state = { note, storedToken: !!token };
        console.log('Login debug:', state);
        debugInfo.textContent = JSON.stringify(state, null, 2);
      }catch(e){ console.warn('debug error', e); }
    }

    function doLogin(){
      const user = (document.getElementById('user').value || '').trim();
      const pass = (document.getElementById('pass').value || '').trim();
      const msg = document.getElementById('msg');
      msg.style.color = '#c33';
      if (!user || !pass){ msg.textContent = 'Podaj login i hasło.'; updateDebug('missing_fields'); return; }
      updateDebug(`attempt userLen=${user.length} passLen=${pass.length}`);
      if (user === 'adas' && pass === 'emilka'){
        try{
          const token = Math.random().toString(36).slice(2) + Date.now().toString(36);
          localStorage.setItem('adminToken', token);
          msg.style.color = 'green'; msg.textContent = 'Zalogowano.';
          updateDebug('ok_logged_in');
          setTimeout(()=>{ const ref = document.referrer || '/'; window.location = ref; }, 600);
        } catch(e){ msg.textContent = 'Błąd zapisu localStorage'; updateDebug('localStorage_error'); }
      } else { msg.textContent = 'Nieprawidłowy login lub hasło.'; updateDebug('invalid_credentials'); }
    }

    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('pass').addEventListener('keydown', (e)=>{ if (e.key === 'Enter') doLogin(); });
  </script>
  <script src="/auth.js"></script>
</body>
</html>
