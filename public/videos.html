<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filmy weselne</title><link rel="stylesheet" href="/styles.css"></head><body><header><h1>Filmy weselne</h1><nav class="top-nav"><a href="/" class="btn-outline">Strona główna</a><a href="/photos.html" class="btn-outline">Zdjęcia</a></nav></header><main><section class="gallery"><div id="videos" class="galleryGrid">Ładowanie...</div></section></main><script src="/api-config.js"></script><script src="/quiz-gate.js"></script><script>const base=window.API_URL||'';(async()=>{const box=document.getElementById('videos');try{const r=await fetch(base+'/api/files');const items=(await r.json()).filter(x=>x.type==='video');box.innerHTML='';if(!items.length){box.innerHTML='<p>Brak przesłanych filmów.</p>';return}items.forEach(x=>{const v=document.createElement('video');v.src=x.key?base+'/api/zdjecia?key='+encodeURIComponent(x.key):x.url;v.controls=true;box.appendChild(v)})}catch(_){box.textContent='Nie udało się pobrać filmów.'}})();</script></body></html>
