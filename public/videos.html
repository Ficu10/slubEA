<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filmy weselne</title><link rel="stylesheet" href="/styles.css"></head><body><header><h1>Filmy weselne</h1><nav class="top-nav"><a href="/" class="btn-outline">Strona główna</a><a href="/photos.html" class="btn-outline">Zdjęcia</a></nav></header><main><section class="gallery"><div id="videos" class="galleryGrid">Ładowanie...</div></section></main><div id="mediaPreview" class="media-preview" hidden><button class="media-close" type="button" title="Zamknij">×</button><a id="mediaDownload" class="media-download" download title="Pobierz" aria-label="Pobierz">⇩</a><video id="mediaVideo" controls autoplay></video></div><script src="/api-config.js"></script><script src="/quiz-gate.js"></script><script>const base=window.API_URL||'';const mediaUrl=x=>x.key?base+'/api/zdjecia?key='+encodeURIComponent(x.key):x.url;const preview=document.getElementById('mediaPreview');const video=document.getElementById('mediaVideo');const download=document.getElementById('mediaDownload');document.querySelector('.media-close').onclick=()=>{video.pause();preview.hidden=true};(async()=>{const box=document.getElementById('videos');try{const r=await fetch(base+'/api/files');const items=(await r.json()).filter(x=>x.type==='video');box.innerHTML='';if(!items.length){box.innerHTML='<p>Brak przesłanych filmów.</p>';return}items.forEach(x=>{const card=document.createElement('div');card.className='card media-thumb';const v=document.createElement('video');v.src=mediaUrl(x);v.muted=true;v.preload='metadata';card.appendChild(v);card.onclick=()=>{video.src=mediaUrl(x);download.href=mediaUrl(x);download.download=x.name||'film';preview.hidden=false};box.appendChild(card)})}catch(_){box.textContent='Nie udało się pobrać filmów.'}})();</script></body></html>
