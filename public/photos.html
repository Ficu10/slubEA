<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zdjęcia weselne</title><link rel="stylesheet" href="/styles.css"></head><body><header><h1>Zdjęcia weselne</h1><nav class="top-nav"><a href="/" class="btn-outline">Strona główna</a><a href="/videos.html" class="btn-outline">Filmy</a></nav></header><main><section class="gallery"><div id="photos" class="galleryGrid">Ładowanie...</div></section></main><div id="mediaPreview" class="media-preview" hidden><button class="media-close" type="button" title="Zamknij">×</button><a id="mediaDownload" class="media-download" download title="Pobierz" aria-label="Pobierz">⇩</a><img id="mediaImage" alt="" /></div><script src="/api-config.js"></script><script src="/quiz-gate.js"></script><script>const base=window.API_URL||'';const mediaUrl=x=>x.key?base+'/api/zdjecia?key='+encodeURIComponent(x.key):x.url;const preview=document.getElementById('mediaPreview');const image=document.getElementById('mediaImage');const download=document.getElementById('mediaDownload');document.querySelector('.media-close').onclick=()=>preview.hidden=true;(async()=>{const box=document.getElementById('photos');try{const r=await fetch(base+'/api/files');const items=(await r.json()).filter(x=>x.type==='image');box.innerHTML='';if(!items.length){box.innerHTML='<p>Brak przesłanych zdjęć.</p>';return}items.forEach(x=>{const card=document.createElement('div');card.className='card media-thumb';const img=document.createElement('img');img.src=mediaUrl(x);img.alt=x.name;card.appendChild(img);card.onclick=()=>{image.src=mediaUrl(x);download.href=mediaUrl(x);download.download=x.name||'zdjecie';preview.hidden=false};box.appendChild(card)})}catch(_){box.textContent='Nie udało się pobrać zdjęć.'}})();</script></body></html>
