<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zdjęcia weselne</title><link rel="stylesheet" href="/styles.css"></head><body><header><h1>Zdjęcia weselne</h1><nav class="top-nav"><a href="/" class="btn-outline">Strona główna</a><a href="/videos.html" class="btn-outline">Filmy</a></nav></header><main><section class="gallery"><div id="photos" class="galleryGrid">Ładowanie...</div></section></main><script src="/api-config.js"></script><script src="/quiz-gate.js"></script><script>const base=window.API_URL||'';(async()=>{const box=document.getElementById('photos');try{const r=await fetch(base+'/api/files');const items=(await r.json()).filter(x=>x.type==='image');box.innerHTML='';if(!items.length){box.innerHTML='<p>Brak przesłanych zdjęć.</p>';return}items.forEach(x=>{const img=document.createElement('img');img.src=x.key?base+'/api/zdjecia?key='+encodeURIComponent(x.key):x.url;img.alt=x.name;box.appendChild(img)})}catch(_){box.textContent='Nie udało się pobrać zdjęć.'}})();</script></body></html>
