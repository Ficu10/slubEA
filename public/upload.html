<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Upload — bucketea</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body style="padding:20px">
  <h1>Upload do R2</h1>
  <input id="file" type="file" />
  <button id="up">Wyślij</button>
  <div id="status" style="margin-top:12px"></div>
  <img id="preview" style="max-width:320px;display:block;margin-top:12px" />

  <h2 style="margin-top:20px">Zdjęcia</h2>
  <div id="zdjecia" style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px"></div>

  <script>
  document.getElementById('up').addEventListener('click', async ()=>{
    const f = document.getElementById('file').files[0];
    const s = document.getElementById('status');
    const preview = document.getElementById('preview');
    if (!f){ s.textContent='Wybierz plik'; return; }
    s.textContent = 'Proszę czekać...';
    document.getElementById('up').disabled = true;
    try{
      const form = new FormData();
      form.append('files', f);

      // send and capture server response (expected JSON with { key, url })
      const respText = await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload', true);
        xhr.upload.onprogress = function(e){ if (e.lengthComputable) s.textContent = 'Wysyłanie: ' + Math.round((e.loaded/e.total)*100) + '%'; };
        xhr.onload = function(){
          if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.responseText);
          else reject(new Error('Upload failed: '+xhr.status+' '+xhr.statusText+' - '+xhr.responseText));
        };
        xhr.onerror = function(){ reject(new Error('Network error during upload')); };
        xhr.send(form);
      });

      s.textContent = 'Upload zakończony, pobieranie URL...';

      let uploadData;
      try{ uploadData = JSON.parse(respText); }catch(e){ uploadData = null; }
      // handle new { success: true, files: [...] } shape or old { key, url }
      const firstFile = (uploadData && uploadData.files && uploadData.files[0]) || uploadData;
      if (firstFile && (firstFile.url || uploadData.url)){
        const url = firstFile.url || uploadData.url;
        preview.src = url;
        s.textContent = 'Wysłano: ' + (firstFile.key || firstFile.name || uploadData.key || 'plik');
      } else {
        // fallback: request file list and show newest
        const list = await fetch('/api/files');
        const txt = await list.text();
        let data;
        try{ data = JSON.parse(txt); }catch(e){ throw new Error('Invalid JSON from /api/files: '+txt); }
        if (!Array.isArray(data) || data.length === 0) throw new Error('No files returned from /api/files');
        const newest = data[0];
        if (newest.url) preview.src = newest.url;
        s.textContent = 'Wysłano: ' + (newest.name || 'plik');
      }

      // add to Zdjęcia list (prefer proxy path using returned key)
      try {
        const img = document.createElement('img');
        img.style.maxWidth = '200px';
        img.style.display = 'block';
        img.style.objectFit = 'cover';
        const fileObj = (uploadData && uploadData.files && uploadData.files[0]) || uploadData;
        img.alt = fileObj && (fileObj.key || fileObj.name) ? (fileObj.key || fileObj.name) : 'uploaded';
        if (fileObj && fileObj.key) {
          img.src = '/api/zdjecia?key=' + encodeURIComponent(fileObj.key);
          img.onerror = () => { if (fileObj.url) img.src = fileObj.url; };
        } else if (fileObj && fileObj.url) {
          img.src = fileObj.url;
        }
        document.getElementById('zdjecia').prepend(img);
      } catch (e) { console.warn('Could not insert image into Zdjecia list', e); }
    }catch(e){ console.error(e); s.textContent = 'Błąd: ' + e.message; }
    finally{ document.getElementById('up').disabled = false; }
  });
  </script>
</body>
</html>
